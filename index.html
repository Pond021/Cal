<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบคณิต ป.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #1f2a3a;
    --muted: #6b7686;
    --primary: #3b6fe0;
    --primary-soft: #e7eefc;
    --border: #dfe5ee;
    --ok: #1f9d55;
    --ok-soft: #e3f6ea;
    --bad: #d64545;
    --bad-soft: #fbe7e7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Sarabun", sans-serif;
    font-size: 18px;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 120px; }
  header { text-align: center; margin-bottom: 24px; }
  h1 { font-family: "Mitr", sans-serif; font-weight: 500; font-size: 28px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); }

  .progress {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); padding: 10px 0; margin-bottom: 12px;
  }
  .progress-text { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); }
  .bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; width: 0; background: var(--primary); transition: width .25s; }

  .q {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; margin-bottom: 16px;
  }
  .q-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
  .num {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    background: var(--primary-soft); color: var(--primary);
    font-family: "Mitr", sans-serif; display: grid; place-items: center; font-size: 15px;
  }
  .q-text { font-weight: 600; white-space: pre-line; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .choices { grid-template-columns: 1fr; } }
  .choice {
    display: flex; gap: 10px; align-items: center; text-align: left;
    padding: 10px 14px; border: 2px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text); font: inherit; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .choice:hover:not(:disabled) { border-color: var(--primary); }
  .choice .letter { font-family: "Mitr", sans-serif; color: var(--muted); }
  .choice.selected { border-color: var(--primary); background: var(--primary-soft); }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: var(--ok); background: var(--ok-soft); }
  .choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .q.unanswered { border-color: var(--bad); }
  .q-result { margin-top: 10px; font-size: 16px; font-weight: 600; }
  .q-result.ok { color: var(--ok); }
  .q-result.bad { color: var(--bad); }

  .actions { text-align: center; margin-top: 24px; }
  .btn {
    font-family: "Mitr", sans-serif; font-size: 18px; border: 0; border-radius: 12px;
    padding: 12px 36px; cursor: pointer; background: var(--primary); color: #fff;
  }
  .btn.secondary { background: var(--card); color: var(--primary); border: 2px solid var(--primary); }
  .btn + .btn { margin-left: 8px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(20, 30, 50, .5);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--card); border-radius: 18px; padding: 28px 24px;
    width: 100%; max-width: 420px; text-align: center;
  }
  .modal h2 { font-family: "Mitr", sans-serif; font-weight: 500; margin: 0 0 8px; }
  .score { font-family: "Mitr", sans-serif; font-size: 56px; color: var(--primary); line-height: 1.2; }
  .score small { font-size: 24px; color: var(--muted); }
  .stats { display: flex; justify-content: center; gap: 20px; margin: 12px 0; font-size: 16px; }
  .stats .ok { color: var(--ok); } .stats .bad { color: var(--bad); }
  .msg { margin: 8px 0 20px; }
  .modal .btn { margin: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📘 ข้อสอบคณิตศาสตร์ ป.3</h1>
    <p>ติวสอบปลายภาค · 20 ข้อ · เลือกคำตอบที่ถูกต้องที่สุด</p>
  </header>

  <div class="progress">
    <div class="progress-text"><span id="progressText">ทำแล้ว 0 / 20 ข้อ</span><span id="scoreLive"></span></div>
    <div class="bar"><div id="barFill"></div></div>
  </div>

  <div id="quiz"></div>

  <div class="actions">
    <button class="btn" id="submitBtn">ส่งคำตอบ</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="resultTitle">สรุปคะแนน</h2>
    <div class="score"><span id="scoreNum">0</span><small> / 20</small></div>
    <div class="stats">
      <span class="ok">✔ ถูก <b id="okNum">0</b> ข้อ</span>
      <span class="bad">✘ ผิด <b id="badNum">0</b> ข้อ</span>
      <span>คิดเป็น <b id="pct">0</b>%</span>
    </div>
    <p class="msg" id="resultMsg"></p>
    <button class="btn secondary" id="reviewBtn">ดูเฉลย</button>
    <button class="btn" id="retryBtn">ทำใหม่</button>
  </div>
</div>

<script>
// answer = index ของคำตอบที่ถูกใน choices (ตัวเลือกจะถูกสลับตำแหน่งตอนแสดงผล)
const QUESTIONS = [
  { q: "ตัวเลข 5 ในจำนวน 45,678 อยู่ในหลักใด", choices: ["หลักพัน", "หลักร้อย", "หลักหมื่น", "หลักสิบ"], answer: 0 },
  { q: "จำนวนใดมากที่สุด", choices: ["56,897", "56,879", "56,798", "56,789"], answer: 0 },
  { q: "3,456 + 2,789 = ?", choices: ["6,245", "6,145", "5,245", "6,235"], answer: 0 },
  { q: "8,000 − 3,475 = ?", choices: ["4,525", "4,635", "5,525", "4,535"], answer: 0 },
  { q: "125 × 4 = ?", choices: ["500", "400", "450", "520"], answer: 0 },
  { q: "96 ÷ 8 = ?", choices: ["12", "11", "13", "14"], answer: 0 },
  { q: "50 ÷ 7 ได้ผลลัพธ์เท่าใด", choices: ["7 เศษ 1", "7 เศษ 2", "6 เศษ 8", "8 เศษ 1"], answer: 0 },
  { q: "แม่มีเงิน 500 บาท ซื้อข้าวสาร 185 บาท และซื้อไข่ 96 บาท\nแม่เหลือเงินกี่บาท", choices: ["219 บาท", "229 บาท", "281 บาท", "319 บาท"], answer: 0 },
  { q: "นักเรียน 48 คน แบ่งเป็นกลุ่ม กลุ่มละ 6 คน จะได้กี่กลุ่ม", choices: ["8 กลุ่ม", "7 กลุ่ม", "9 กลุ่ม", "6 กลุ่ม"], answer: 0 },
  { q: "ดินสอราคาแท่งละ 7 บาท ซื้อ 12 แท่ง ต้องจ่ายเงินกี่บาท", choices: ["84 บาท", "74 บาท", "82 บาท", "94 บาท"], answer: 0 },
  { q: "มีธนบัตร 100 บาท 2 ใบ เหรียญ 10 บาท 3 เหรียญ และเหรียญ 5 บาท 1 เหรียญ\nรวมเป็นเงินกี่บาท", choices: ["235 บาท", "225 บาท", "215 บาท", "335 บาท"], answer: 0 },
  { q: "1 เมตร เท่ากับกี่เซนติเมตร", choices: ["100 เซนติเมตร", "10 เซนติเมตร", "1,000 เซนติเมตร", "50 เซนติเมตร"], answer: 0 },
  { q: "2 กิโลกรัม 300 กรัม เท่ากับกี่กรัม", choices: ["2,300 กรัม", "2,030 กรัม", "230 กรัม", "23,000 กรัม"], answer: 0 },
  { q: "เทน้ำจากขวด 4 ขวด ขวดละ 250 มิลลิลิตร รวมเป็นน้ำกี่ลิตร", choices: ["1 ลิตร", "2 ลิตร", "10 ลิตร", "4 ลิตร"], answer: 0 },
  { q: "น้องเริ่มดูการ์ตูนเวลา 13.15 น. ดูนาน 1 ชั่วโมง 30 นาที\nน้องดูการ์ตูนเสร็จเวลาใด", choices: ["14.45 น.", "14.15 น.", "15.45 น.", "14.30 น."], answer: 0 },
  { q: "แบ่งพิซซ่าเป็น 8 ชิ้นเท่า ๆ กัน กินไป 3 ชิ้น\nกินพิซซ่าไปเท่าไรของทั้งถาด", choices: ["3/8", "5/8", "3/5", "8/3"], answer: 0 },
  { q: "1/5 + 2/5 = ?", choices: ["3/5", "3/10", "2/5", "1/5"], answer: 0 },
  { q: "รูปสี่เหลี่ยมจัตุรัสมีแกนสมมาตรกี่แกน", choices: ["4 แกน", "2 แกน", "1 แกน", "ไม่มีแกนสมมาตร"], answer: 0 },
  { q: "จำนวนถัดไปคือจำนวนใด\n5, 10, 20, 40, ___", choices: ["80", "60", "50", "45"], answer: 0 },
  { q: "แผนภูมิรูปภาพ กำหนดให้ 🍎 1 รูป แทนผลไม้ 5 ผล\nร้านขายแอปเปิลได้ 🍎🍎🍎🍎 ร้านขายแอปเปิลได้กี่ผล", choices: ["20 ผล", "4 ผล", "9 ผล", "25 ผล"], answer: 0 },
];

const LETTERS = ["ก", "ข", "ค", "ง"];
let state = []; // { order: [indices], picked: null | displayIndex }
let submitted = false;

const quizEl = document.getElementById("quiz");
const overlay = document.getElementById("overlay");

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  submitted = false;
  state = QUESTIONS.map(() => ({ order: shuffle([0, 1, 2, 3]), picked: null }));
  render();
  updateProgress();
  document.getElementById("submitBtn").textContent = "ส่งคำตอบ";
  document.getElementById("scoreLive").textContent = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() {
  quizEl.innerHTML = "";
  QUESTIONS.forEach((item, qi) => {
    const s = state[qi];
    const box = document.createElement("div");
    box.className = "q";
    box.id = "q" + qi;

    const head = document.createElement("div");
    head.className = "q-head";
    head.innerHTML = `<span class="num">${qi + 1}</span>`;
    const text = document.createElement("div");
    text.className = "q-text";
    text.textContent = item.q;
    head.appendChild(text);
    box.appendChild(head);

    const list = document.createElement("div");
    list.className = "choices";
    s.order.forEach((ci, di) => {
      const btn = document.createElement("button");
      btn.className = "choice";
      btn.innerHTML = `<span class="letter">${LETTERS[di]}.</span><span></span>`;
      btn.lastChild.textContent = item.choices[ci];
      if (s.picked === di) btn.classList.add("selected");
      if (submitted) {
        btn.disabled = true;
        if (ci === item.answer) btn.classList.add("correct");
        else if (s.picked === di) btn.classList.add("wrong");
      } else {
        btn.addEventListener("click", () => pick(qi, di));
      }
      list.appendChild(btn);
    });
    box.appendChild(list);

    if (submitted) {
      const res = document.createElement("div");
      const ok = s.picked !== null && s.order[s.picked] === item.answer;
      const correctDi = s.order.indexOf(item.answer);
      res.className = "q-result " + (ok ? "ok" : "bad");
      res.textContent = ok
        ? "✔ ถูกต้อง"
        : `✘ ${s.picked === null ? "ไม่ได้ตอบ" : "ตอบผิด"} — คำตอบที่ถูกคือ ${LETTERS[correctDi]}. ${item.choices[item.answer]}`;
      box.appendChild(res);
    }
    quizEl.appendChild(box);
  });
}

function pick(qi, di) {
  state[qi].picked = di;
  const box = document.getElementById("q" + qi);
  box.classList.remove("unanswered");
  box.querySelectorAll(".choice").forEach((b, i) => b.classList.toggle("selected", i === di));
  updateProgress();
}

function updateProgress() {
  const done = state.filter(s => s.picked !== null).length;
  document.getElementById("progressText").textContent = `ทำแล้ว ${done} / ${QUESTIONS.length} ข้อ`;
  document.getElementById("barFill").style.width = (done / QUESTIONS.length * 100) + "%";
}

function submit() {
  if (submitted) { init(); return; }
  const missing = state.map((s, i) => s.picked === null ? i : -1).filter(i => i >= 0);
  if (missing.length) {
    missing.forEach(i => document.getElementById("q" + i).classList.add("unanswered"));
    const go = confirm(`ยังไม่ได้ตอบอีก ${missing.length} ข้อ (ข้อ ${missing.map(i => i + 1).join(", ")})\nต้องการส่งคำตอบเลยหรือไม่?`);
    if (!go) {
      document.getElementById("q" + missing[0]).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
  }
  submitted = true;
  const score = state.filter((s, i) => s.picked !== null && s.order[s.picked] === QUESTIONS[i].answer).length;
  const total = QUESTIONS.length;
  const pct = Math.round(score / total * 100);

  document.getElementById("scoreNum").textContent = score;
  document.getElementById("okNum").textContent = score;
  document.getElementById("badNum").textContent = total - score;
  document.getElementById("pct").textContent = pct;

  let title, msg;
  if (pct >= 90)      { title = "🏆 ยอดเยี่ยมมาก!"; msg = "เก่งมาก พร้อมสอบปลายภาคแล้ว"; }
  else if (pct >= 75) { title = "🌟 เก่งมาก!"; msg = "ทำได้ดี ทบทวนข้อที่ผิดอีกนิดนะ"; }
  else if (pct >= 50) { title = "👍 ผ่าน"; msg = "ดีแล้ว ลองดูเฉลยแล้วฝึกเพิ่มอีกหน่อย"; }
  else                { title = "💪 สู้ ๆ นะ"; msg = "ลองดูเฉลย แล้วทำใหม่อีกครั้ง"; }
  document.getElementById("resultTitle").textContent = title;
  document.getElementById("resultMsg").textContent = msg;
  document.getElementById("scoreLive").textContent = `คะแนน ${score} / ${total}`;
  document.getElementById("submitBtn").textContent = "ทำใหม่";

  render();
  overlay.classList.add("show");
}

document.getElementById("submitBtn").addEventListener("click", submit);
document.getElementById("reviewBtn").addEventListener("click", () => {
  overlay.classList.remove("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
});
document.getElementById("retryBtn").addEventListener("click", () => {
  overlay.classList.remove("show");
  init();
});
overlay.addEventListener("click", e => { if (e.target === overlay) overlay.classList.remove("show"); });

init();
</script>
</body>
</html>
